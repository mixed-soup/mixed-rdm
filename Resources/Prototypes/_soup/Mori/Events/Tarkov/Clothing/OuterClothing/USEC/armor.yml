- type: entity
  parent: [ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseSecurityContraband]
  id: ClothingOuterArmorUSEC
  name: бронежилет HighCom Trooper TFO
  description: Лёгкий бронежилет американской фирмы Highcom, хорошо знакомый и популярный среди оперативников ЧВК USEC. Вместо тяжёлых стальных плит использует облегчённые композитные вставки AR500 4-го класса защиты, которые прикрывают только жизненно важные области - грудь и спину . Это делает его значительно более удобным и манёвренным, чем армейские аналоги, но требует от бойца большей осторожности. Платой за лёгкость становится меньшая площадь защиты - бёдра и плечи остаются уязвимыми. Идеальный выбор для быстрых рейдов и штурмовых операций, где скорость решает всё.
  components:
  - type: Sprite
    sprite: _soup/Mori/Events/Tarkov/Clothing/OuterClothing/USEC/USECArmor.rsi
  - type: Clothing
    sprite: _soup/Mori/Events/Tarkov/Clothing/OuterClothing/USEC/USECArmor.rsi
  - type: StaminaResistance
    damageCoefficient: 0.95
  - type: Armor # Based on /tg/ but slightly compensated to fit the fact that armor stacks in SS14. :x:
    coverage: # backmen: armour coverage
    - Chest
    - Groin # Понимаю, что описание этому противоречит, но балансик нужен.
    - Tail
    - Hand
    traumaDeductions:
      Dismemberment: 0.21
      OrganDamage: 0.21
      BoneDamage: 0.21
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.5 #Can save you, but bullets will still hurt. Will take about 10 shots from a Viper before critting, as opposed to 7 while unarmored and 16~ with a bulletproof vest.
        ArmorPiercing: 0.5
        Heat: 0.8

  - type: ExplosionResistance
    damageCoefficient: 0.90
  - type: Tag
    tags:
      - BroneArachne