- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitUSEC1
  name: тактический костюм "MultiCam"
  description: Стандартный полевой костюм оперативников USEC, выполненный в камуфляже MultiCam. Этот рисунок был разработан для армии США и успешно используется по всему миру. Сочетание песочных, оливковых и коричневых тонов делает бойца практически невидимым в сухой траве, глинистой местности и даже в бетонных руинах. Костюм выполнен из лёгкой, дышащей ткани с усиленными вставками на коленях и локтях, что позволяет долго находиться в полевых условиях. На плечах и груди - нашивки с логотипом USEC и тактическими метками. Идеальный выбор для рейдов и засад.
  components:
  - type: Sprite
    sprite: _soup/Mori/Events/Tarkov/Clothing/Uniforms/USEC/USECUniform1.rsi
  - type: Clothing
    sprite: _soup/Mori/Events/Tarkov/Clothing/Uniforms/USEC/USECUniform1.rsi

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitUSEC2
  name: тактический костюм "Песчаная буря" 
  description: Лёгкий и неформальный комплект экипировки, популярный среди опытных контрактников USEC. Тактические штаны MultiCam с множеством карманов и усиленных вставок сочетаются с простой коричневой футболкой - практичный выбор для жаркого климата и длительных операций. Этот образ стал визитной карточкой частных военных компаний в Африке и на Ближнем Востоке. Отсутствие бронежилета (или его лёгкая версия) делает бойца более мобильным, а коричневая футболка отлично маскирует пот и грязь. Противники часто недооценивают таких бойцов, принимая их за наёмников-неудачников, но это грубая ошибка - под простой футболкой скрывается профессионал с холодным расчётом и меткой стрельбой.
  components:
  - type: Sprite
    sprite: _soup/Mori/Events/Tarkov/Clothing/Uniforms/USEC/USECUniform2.rsi
  - type: Clothing
    sprite: _soup/Mori/Events/Tarkov/Clothing/Uniforms/USEC/USECUniform2.rsi